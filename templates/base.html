<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DM Automator{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">DM Automator</div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/dashboard/posts">Posts</a>
            <a href="/dashboard/campaigns">Campaigns</a>
            <a href="/dashboard/queue">DM Queue</a>
            <a href="/dashboard/settings">Settings</a>
            <a href="/auth/logout" class="btn-logout">Logout</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <div id="toast-container"></div>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
